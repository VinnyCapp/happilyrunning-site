<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600&amp;family=Alfa+Slab+One&amp;display=swap');
    </style>
  </defs>
  <!-- Element box -->
  <rect x="20" y="30" width="200" height="200" fill="none" stroke="#1a2a2e" stroke-width="5"/>
  <text x="42" y="58" font-family="JetBrains Mono, monospace" font-size="17" font-weight="600" fill="#1a2a2e">31</text>
  <text x="198" y="58" font-family="JetBrains Mono, monospace" font-size="17" font-weight="600" text-anchor="end" fill="#1a2a2e">50K</text>
  <text x="120" y="165" font-family="Alfa Slab One, serif" font-size="128" letter-spacing="-4" text-anchor="middle" fill="#1a2a2e">hr</text>
  <text x="120" y="210" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" letter-spacing="3" text-anchor="middle" fill="#1a2a2e">HAPPILY RUNNING</text>
  <!-- Wordmark -->
  <text x="260" y="108" font-family="Alfa Slab One, serif" font-size="78" letter-spacing="-2" fill="#1a2a2e">happily</text>
  <text x="260" y="178" font-family="Alfa Slab One, serif" font-size="78" letter-spacing="-2" fill="#4a6b52">running</text>
  <!-- Trail blazes -->
  <path d="M 260 210 L 310 204 L 360 207 L 420 194 L 480 199 L 540 188 L 600 195 L 660 191 L 700 198"
        fill="none" stroke="#1a2a2e" stroke-width="7" stroke-linecap="butt" stroke-linejoin="round" stroke-dasharray="20 14"/>
  <circle cx="540" cy="188" r="5" fill="#4a6b52"/>
  <text x="260" y="240" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" letter-spacing="4" fill="#888">HOW ARE YOU RUNNING?</text>
</svg>
