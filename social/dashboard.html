<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HR Social — publisher</title>
<style>
  :root{
    --ink:#1a2a2e; --ink-deep:#0e1a1d; --paper:#f0ece0; --cream:#f7f2e3;
    --moss:#4a6b52; --moss-deep:#2d4a34; --sage:#8fa891; --pine:#3d5448;
    --lake:#2e5d6e; --sunrise:#c49a5c; --sunrise-warm:#d4ad6f;
    --mute:#7c7c72; --line:#d8d2c2; --bad:#b5462f; --warn:#b8862f; --good:#3d7a52;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Space Grotesk',system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--paper);line-height:1.5}
  header{background:var(--ink);color:var(--cream);padding:16px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{font-size:18px;margin:0;letter-spacing:.5px;font-weight:700}
  header .tag{font-size:12px;color:var(--sage);font-family:ui-monospace,monospace}
  header .dry{background:var(--warn);color:#1a1a1a;padding:2px 8px;border-radius:3px;font-size:11px;font-weight:700;letter-spacing:.5px}
  main{max-width:980px;margin:0 auto;padding:24px 20px 80px}
  .bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
  select,input,textarea,button{font:inherit;color:inherit}
  select,input[type=text],input[type=datetime-local],textarea{
    background:var(--cream);border:1px solid var(--line);border-radius:5px;padding:8px 10px}
  textarea{width:100%;resize:vertical;min-height:64px}
  button{cursor:pointer;border:1px solid var(--line);background:var(--cream);border-radius:5px;padding:8px 14px;font-weight:600}
  button:hover{border-color:var(--mute)}
  button.primary{background:var(--moss);color:var(--cream);border-color:var(--moss-deep)}
  button.primary:hover{background:var(--moss-deep)}
  button.go{background:var(--sunrise);border-color:var(--sunrise);color:#211a0c}
  button.danger{color:var(--bad)}
  button:disabled{opacity:.45;cursor:not-allowed}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:var(--mute);border-bottom:1px solid var(--line);padding-bottom:6px;margin:28px 0 14px}
  h2 .n{color:var(--ink);background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:0 8px;font-size:11px;margin-left:6px}
  .card{background:var(--cream);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
  .card.attn{border-color:var(--bad);box-shadow:0 0 0 2px rgba(181,70,47,.12)}
  .card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px}
  .pill{font-size:11px;font-weight:700;letter-spacing:.5px;padding:2px 9px;border-radius:11px;text-transform:uppercase;white-space:nowrap}
  .pill.draft{background:#e7e1d0;color:#6a6457}
  .pill.scheduled{background:#d7e6da;color:var(--good)}
  .pill.posted{background:#d3e0e6;color:var(--lake)}
  .pill.failed{background:#f0d6cf;color:var(--bad)}
  .pill.missed{background:#f1e3c8;color:var(--warn)}
  .meta{font-size:12px;color:var(--mute);font-family:ui-monospace,monospace}
  .meta b{color:var(--ink);font-weight:600}
  .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .actions button{padding:5px 11px;font-size:13px}
  .err{color:var(--bad);font-size:13px;margin-top:8px;font-family:ui-monospace,monospace}
  .field{margin-top:8px}
  .field label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--mute);display:block;margin-bottom:3px}
  .imgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .imgs img{width:74px;height:74px;object-fit:cover;border-radius:5px;border:1px solid var(--line)}
  .muted{color:var(--mute);font-style:italic}
  details summary{cursor:pointer;color:var(--mute);font-size:12px;letter-spacing:1px;text-transform:uppercase}
  .events{font-family:ui-monospace,monospace;font-size:12px;background:var(--ink);color:var(--sage);border-radius:8px;padding:12px;max-height:240px;overflow:auto;margin-top:10px}
  .events .error{color:#e8a08c} .events .warn{color:#e8c98c} .events .success{color:#9ad6ab}
  footer{text-align:center;color:var(--mute);font-size:12px;font-family:ui-monospace,monospace;padding:24px}
  .empty{color:var(--mute);font-style:italic;padding:8px 2px}
</style>
</head>
<body>
<header>
  <h1>HR&nbsp;Social</h1>
  <span class="tag">v__VERSION__</span>
  <span id="dryflag" class="dry" hidden>DRY RUN</span>
  <span id="now" class="tag" style="margin-left:auto"></span>
</header>
<main>
  <div class="bar">
    <label class="meta">Account&nbsp;
      <select id="account"></select>
    </label>
    <label class="meta">Platform&nbsp;
      <select id="platform"><option value="instagram">Instagram</option><option value="facebook">Facebook</option></select>
    </label>
    <input type="text" id="theme" placeholder="Optional theme (e.g. Virgil Crest)" style="flex:1;min-width:160px">
    <button id="draftBtn" class="primary">Draft a week</button>
    <button id="addBtn">New blank post</button>
    <button id="refreshBtn">Refresh</button>
  </div>

  <section id="attnSec" hidden>
    <h2 style="color:var(--bad);border-color:var(--bad)">⚠ Needs attention <span class="n" id="attnN">0</span></h2>
    <div id="attn"></div>
  </section>

  <h2>Queue <span class="n" id="queueN">0</span></h2>
  <div id="queue"></div>

  <details style="margin-top:24px">
    <summary>Posted history</summary>
    <div id="posted" style="margin-top:12px"></div>
  </details>

  <details style="margin-top:18px" open>
    <summary>Recent activity</summary>
    <div id="events" class="events"></div>
  </details>
</main>
<footer>Happily Running social publisher · v__VERSION__</footer>

<script>
const $ = sel => document.querySelector(sel);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let HEALTH = null;

async function api(method, path, body) {
  const opt = { method, headers: {} };
  if (body !== undefined) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}

function fmtWhen(iso) {
  const d = new Date(iso);
  return d.toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}
function toLocalInput(iso) {
  const d = new Date(iso); const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes());
}

function cardHTML(post) {
  const imgs = (post.image_urls || []).filter(Boolean);
  const imgHtml = imgs.length
    ? '<div class="imgs">' + imgs.map(u => '<img src="' + esc(u) + '" alt="" onerror="this.style.opacity=.3">').join('') + '</div>'
    : '<div class="muted" style="margin-top:8px">No image attached — cannot be approved until one is added.</div>';
  const a = [];
  const id = post.id;
  if (!post.posted) {
    if (post.approved) a.push(btn('unapprove', id, 'Unapprove'));
    else a.push(btn('approve', id, 'Approve', 'primary'));
    if (post.paused) a.push(btn('unpause', id, 'Unpause'));
    else a.push(btn('pause', id, 'Pause'));
    if (post.status === 'failed') a.push(btn('retry', id, 'Retry'));
    if (post.approved && !post.paused) a.push(btn('post-now', id, 'Post now', 'go'));
    a.push('<button onclick="saveEdit(' + id + ')">Save edits</button>');
    a.push('<button class="danger" onclick="del(' + id + ')">Delete</button>');
  }
  const resultLine = post.posted && post.result
    ? '<div class="meta" style="margin-top:6px">Posted ' + esc(fmtWhen(post.posted_at)) + ' · id <b>' + esc(post.result.id || '') + '</b>' + (post.result.dry_run ? ' (dry run)' : '') + '</div>'
    : '';
  return '<div class="card ' + (post.needs_attention ? 'attn' : '') + '">'
    + '<div class="top"><div class="meta">#' + id + ' · <b>' + esc(post.account) + '</b> · ' + esc(post.platform) + '</div>'
    + '<span class="pill ' + post.status + '">' + post.status + (post.approved && !post.posted ? ' ✓' : '') + (post.paused && !post.posted ? ' ⏸' : '') + '</span></div>'
    + (post.posted
        ? '<div style="white-space:pre-wrap">' + esc(post.caption) + '</div>'
        : '<div class="field"><label>Caption</label><textarea id="cap-' + id + '">' + esc(post.caption) + '</textarea></div>'
          + '<div class="field"><label>Image URLs (one per line — static.vinnycapp.com/uploads/…)</label>'
          + '<textarea id="img-' + id + '" style="min-height:48px">' + esc(imgs.join('\n')) + '</textarea></div>'
          + '<div class="field"><label>Scheduled</label><input type="datetime-local" id="when-' + id + '" value="' + toLocalInput(post.scheduled_at) + '"></div>')
    + imgHtml
    + (post.error ? '<div class="err">⚠ ' + esc(post.error) + '</div>' : '')
    + resultLine
    + (!post.posted ? '<div class="meta" style="margin-top:8px">scheduled ' + esc(fmtWhen(post.scheduled_at)) + '</div>' : '')
    + (a.length ? '<div class="actions">' + a.join('') + '</div>' : '')
    + '</div>';
}
function btn(action, id, label, cls) {
  return '<button class="' + (cls || '') + '" onclick="act(\'' + action + '\',' + id + ')">' + label + '</button>';
}

async function act(action, id) {
  try { await api('POST', '/api/posts/' + id + '/' + action); await load(); }
  catch (e) { alert(e.message); }
}
async function del(id) {
  if (!confirm('Delete post #' + id + '?')) return;
  try { await api('DELETE', '/api/posts/' + id); await load(); } catch (e) { alert(e.message); }
}
async function saveEdit(id) {
  const caption = $('#cap-' + id).value;
  const image_urls = $('#img-' + id).value.split('\n').map(s => s.trim()).filter(Boolean);
  const whenVal = $('#when-' + id).value;
  const scheduled_at = whenVal ? new Date(whenVal).toISOString() : undefined;
  try { await api('PATCH', '/api/posts/' + id, { caption, image_urls, scheduled_at }); await load(); }
  catch (e) { alert(e.message); }
}

async function load() {
  const acc = $('#account').value;
  const [posts, events, health] = await Promise.all([
    api('GET', '/api/posts' + (acc ? '?account=' + encodeURIComponent(acc) : '')),
    api('GET', '/api/events'),
    api('GET', '/health'),
  ]);
  HEALTH = health;
  $('#dryflag').hidden = !health.dry_run;
  $('#now').textContent = new Date(health.now).toLocaleString();

  const attn = posts.filter(p => p.needs_attention);
  const queue = posts.filter(p => !p.posted && !p.needs_attention);
  const posted = posts.filter(p => p.posted);

  $('#attnSec').hidden = attn.length === 0;
  $('#attnN').textContent = attn.length;
  $('#attn').innerHTML = attn.map(cardHTML).join('');
  $('#queueN').textContent = queue.length;
  $('#queue').innerHTML = queue.length ? queue.map(cardHTML).join('') : '<div class="empty">Nothing queued. Hit "Draft a week" or add a blank post.</div>';
  $('#posted').innerHTML = posted.length ? posted.map(cardHTML).join('') : '<div class="empty">No posts published yet.</div>';
  $('#events').innerHTML = events.map(e => '<div class="' + e.level + '">' + esc(e.ts.slice(11, 19)) + ' ' + esc(e.msg) + '</div>').join('');
}

async function initAccounts() {
  const accts = await api('GET', '/api/accounts');
  $('#account').innerHTML = accts.map(a => '<option value="' + esc(a.key) + '">' + esc(a.name) + '</option>').join('');
}

$('#draftBtn').addEventListener('click', async () => {
  const btn = $('#draftBtn'); btn.disabled = true; btn.textContent = 'Drafting…';
  try {
    await api('POST', '/api/draft', { account: $('#account').value, platform: $('#platform').value, theme: $('#theme').value.trim() || undefined });
    $('#theme').value = ''; await load();
  } catch (e) { alert(e.message); }
  finally { btn.disabled = false; btn.textContent = 'Draft a week'; }
});
$('#addBtn').addEventListener('click', async () => {
  try { await api('POST', '/api/posts', { account: $('#account').value, platform: $('#platform').value, caption: '' }); await load(); }
  catch (e) { alert(e.message); }
});
$('#refreshBtn').addEventListener('click', load);
$('#account').addEventListener('change', load);

(async () => {
  try { await initAccounts(); await load(); } catch (e) { document.querySelector('main').innerHTML = '<p class="err">Failed to load: ' + esc(e.message) + '</p>'; }
  setInterval(load, 30000);
})();
</script>
</body>
</html>
